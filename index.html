<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Men's Sunglasses | Fancy Spot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">

    <!-- HEADER -->
    <header class="main-header">
      <img src="images/logo.png" class="logo" alt="Fancy Spot Logo">
    </header>

    <!-- NAVIGATION -->
    <nav class="main-nav">
      <ul>
        <li>Men</li>
        <li>Women</li>
        <li>New Arrivals</li>
        <li>Brands</li>
      </ul>
    </nav>

    <!-- FILTERS -->
    <div class="filters">
      <span class="filter-title">Filter by:</span>
      <button class="filter-btn">Price</button>
      <button class="filter-btn">Color</button>
      <button class="filter-btn">Brand</button>
    </div>

    <!-- PAGE TITLE -->
    <h1 class="page-title">Men's Sunglasses</h1>

    <!-- PRODUCT GRID -->
    <div id="product-grid"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
